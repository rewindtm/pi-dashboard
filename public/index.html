<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<title>Pi Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="https://unpkg.com/xterm@5.3.0/css/xterm.css" />
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --border: #2a2e38; --text: #e6e8ee;
    --muted: #8b93a5; --accent: #4f8cff; --danger: #e5484d; --ok: #2fb170;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; }
  #login { display: flex; align-items: center; justify-content: center; height: 100vh; flex-direction: column; gap: 12px; }
  #login input { padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel); color: var(--text); width: 280px; }
  #login button, .btn { padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--accent); color: white; cursor: pointer; }
  .btn.secondary { background: var(--panel); color: var(--text); }
  .btn.danger { background: var(--danger); }
  #app { display: none; height: 100vh; flex-direction: column; }
  header { display: flex; align-items: center; gap: 16px; padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--panel); }
  header h1 { font-size: 15px; margin: 0; flex: 1; color: var(--muted); font-weight: 600; }
  nav { display: flex; gap: 4px; padding: 8px 16px; border-bottom: 1px solid var(--border); }
  nav button { background: transparent; border: none; color: var(--muted); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 14px; }
  nav button.active { background: var(--panel); color: var(--text); }
  main { flex: 1; overflow: auto; padding: 16px; }
  .view { display: none; height: 100%; }
  .view.active { display: block; }
  #terminal-view.active { display: flex; flex-direction: column; }
  #terminal { flex: 1; background: #000; border-radius: 8px; padding: 8px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
  .card h3 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; color: var(--muted); }
  .card .val { font-size: 22px; font-weight: 600; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; }
  .row-actions button { margin-right: 4px; font-size: 12px; padding: 4px 8px; }
  #files-path { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
  #files-list button.namebtn { background: none; border: none; color: var(--text); cursor: pointer; text-align: left; padding: 0; }
  #file-editor { width: 100%; height: 300px; background: #000; color: #e6e8ee; border: 1px solid var(--border); border-radius: 8px; padding: 8px; font-family: monospace; }
  .toolbar { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; align-items: center; }
  .toolbar input { padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border); background: #0d0f14; color: var(--text); }
  #exec-out { white-space: pre-wrap; background: #000; border-radius: 8px; padding: 10px; font-family: monospace; font-size: 13px; min-height: 120px; }
</style>
</head>
<body>

<div id="login">
  <h2>Pi Dashboard</h2>
  <input id="token-input" type="password" placeholder="Token di accesso" />
  <button onclick="login()">Accedi</button>
  <div id="login-error" style="color:var(--danger)"></div>
</div>

<div id="app">
  <header>
    <h1 id="hostname">Pi Dashboard</h1>
    <button class="btn secondary" onclick="logout()">Esci</button>
  </header>
  <nav>
    <button class="tab active" data-view="terminal-view">Terminale</button>
    <button class="tab" data-view="system-view">Sistema</button>
    <button class="tab" data-view="services-view">Servizi</button>
    <button class="tab" data-view="files-view">File</button>
    <button class="tab" data-view="exec-view">API / Esegui</button>
  </nav>
  <main>
    <div id="terminal-view" class="view active">
      <div id="terminal"></div>
    </div>

    <div id="system-view" class="view">
      <div class="cards" id="system-cards"></div>
    </div>

    <div id="services-view" class="view">
      <div class="toolbar">
        <button class="btn secondary" onclick="loadServices()">Aggiorna</button>
      </div>
      <table id="services-table">
        <thead><tr><th>Unit</th><th>Load</th><th>Active</th><th>Sub</th><th>Azioni</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>

    <div id="files-view" class="view">
      <div id="files-path"></div>
      <table id="files-list">
        <thead><tr><th>Nome</th><th>Dimensione</th><th>Azioni</th></tr></thead>
        <tbody></tbody>
      </table>
      <h4>Editor</h4>
      <div id="editor-path" style="color:var(--muted);font-size:13px;margin-bottom:6px;"></div>
      <textarea id="file-editor" placeholder="Apri un file per modificarlo..."></textarea>
      <div class="toolbar"><button class="btn" onclick="saveFile()">Salva</button></div>
    </div>

    <div id="exec-view" class="view">
      <p style="color:var(--muted)">Esegui un comando remoto tramite l'API (usata anche per l'accesso programmatico).</p>
      <div class="toolbar">
        <input id="exec-cmd" style="flex:1" placeholder="es. uptime" />
        <button class="btn" onclick="runExec()">Esegui</button>
      </div>
      <div id="exec-out"></div>
    </div>
  </main>
</div>

<script src="https://unpkg.com/xterm@5.3.0/lib/xterm.js"></script>
<script src="https://unpkg.com/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
<script>
let TOKEN = localStorage.getItem('pi_dashboard_token') || '';

function authHeaders() {
  return { Authorization: 'Bearer ' + TOKEN };
}

async function login() {
  const input = document.getElementById('token-input').value.trim();
  const res = await fetch('/api/login?token=' + encodeURIComponent(input));
  const data = await res.json();
  if (data.ok) {
    TOKEN = input;
    localStorage.setItem('pi_dashboard_token', TOKEN);
    document.getElementById('login').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    initApp();
  } else {
    document.getElementById('login-error').textContent = 'Token non valido';
  }
}

function logout() {
  localStorage.removeItem('pi_dashboard_token');
  location.reload();
}

document.querySelectorAll('nav .tab').forEach((btn) => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('nav .tab').forEach((b) => b.classList.remove('active'));
    document.querySelectorAll('.view').forEach((v) => v.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.view).classList.add('active');
    if (btn.dataset.view === 'system-view') loadSystem();
    if (btn.dataset.view === 'services-view') loadServices();
    if (btn.dataset.view === 'files-view') loadFiles('');
    if (btn.dataset.view === 'terminal-view' && window.fitAddon) setTimeout(() => window.fitAddon.fit(), 50);
  });
});

let initialized = false;
function initApp() {
  if (initialized) return;
  initialized = true;
  initTerminal();
  loadSystem();
  setInterval(() => {
    if (document.getElementById('system-view').classList.contains('active')) loadSystem();
  }, 5000);
}

function initTerminal() {
  const term = new Terminal({ theme: { background: '#000000' }, fontSize: 14 });
  const fitAddon = new FitAddon.FitAddon();
  term.loadAddon(fitAddon);
  term.open(document.getElementById('terminal'));
  fitAddon.fit();
  window.fitAddon = fitAddon;

  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(proto + '://' + location.host + '/ws/terminal?token=' + encodeURIComponent(TOKEN));
  ws.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    if (msg.type === 'data') term.write(msg.data);
    if (msg.type === 'exit') term.write('\r\n[processo terminato]\r\n');
  };
  term.onData((data) => ws.send(JSON.stringify({ type: 'input', data })));
  const sendResize = () => ws.readyState === 1 && ws.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
  ws.onopen = sendResize;
  window.addEventListener('resize', () => { fitAddon.fit(); sendResize(); });
}

function fmtBytes(n) {
  if (!n && n !== 0) return '-';
  const units = ['B', 'KB', 'MB', 'GB', 'TB'];
  let i = 0; let v = n;
  while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
  return v.toFixed(1) + ' ' + units[i];
}

async function loadSystem() {
  try {
    const res = await fetch('/api/system/stats', { headers: authHeaders() });
    if (!res.ok) throw new Error('errore ' + res.status);
    const d = await res.json();
    document.getElementById('hostname').textContent = 'Pi Dashboard — ' + (d.os.hostname || '');
    const temp = d.cpuTemp && d.cpuTemp.main ? d.cpuTemp.main.toFixed(1) + ' °C' : 'n/d';
    const uptimeH = (d.uptime / 3600).toFixed(1) + ' h';
    const cards = [
      ['CPU', d.cpu.brand + ' (' + d.cpu.cores + ' core)'],
      ['Carico CPU', d.load.currentLoad.toFixed(1) + ' %'],
      ['Temperatura', temp],
      ['RAM', fmtBytes(d.mem.used) + ' / ' + fmtBytes(d.mem.total)],
      ['Uptime', uptimeH],
      ['OS', d.os.distro + ' (' + d.os.arch + ')'],
    ];
    d.fs.slice(0, 3).forEach((f) => cards.push(['Disco ' + f.mount, fmtBytes(f.used) + ' / ' + fmtBytes(f.size) + ' (' + f.use + '%)']));
    document.getElementById('system-cards').innerHTML = cards
      .map(([k, v]) => `<div class="card"><h3>${k}</h3><div class="val">${v}</div></div>`)
      .join('');
  } catch (err) {
    document.getElementById('system-cards').innerHTML = '<div class="card">Errore: ' + err.message + '</div>';
  }
}

async function loadServices() {
  const tbody = document.querySelector('#services-table tbody');
  tbody.innerHTML = '<tr><td colspan="5">Caricamento...</td></tr>';
  try {
    const res = await fetch('/api/services', { headers: authHeaders() });
    const d = await res.json();
    if (!res.ok) throw new Error(d.error || 'errore');
    tbody.innerHTML = d.services
      .map(
        (s) => `<tr>
          <td>${s.unit}</td><td>${s.load}</td><td>${s.active}</td><td>${s.sub}</td>
          <td class="row-actions">
            <button class="btn secondary" onclick="serviceAction('${s.unit}','start')">start</button>
            <button class="btn secondary" onclick="serviceAction('${s.unit}','stop')">stop</button>
            <button class="btn secondary" onclick="serviceAction('${s.unit}','restart')">restart</button>
          </td>
        </tr>`
      )
      .join('');
  } catch (err) {
    tbody.innerHTML = '<tr><td colspan="5">Errore: ' + err.message + '</td></tr>';
  }
}

async function serviceAction(name, action) {
  await fetch('/api/services/' + encodeURIComponent(name) + '/' + action, { method: 'POST', headers: authHeaders() });
  loadServices();
}

let currentDir = '';
async function loadFiles(dir) {
  currentDir = dir;
  const res = await fetch('/api/files/list?path=' + encodeURIComponent(dir), { headers: authHeaders() });
  const d = await res.json();
  document.getElementById('files-path').textContent = '/' + d.path;
  const tbody = document.querySelector('#files-list tbody');
  const rows = [];
  if (dir) rows.push(`<tr><td><button class="namebtn" onclick="loadFiles('${dir.split('/').slice(0, -1).join('/')}')">..</button></td><td></td><td></td></tr>`);
  d.items
    .sort((a, b) => (a.isDir === b.isDir ? a.name.localeCompare(b.name) : a.isDir ? -1 : 1))
    .forEach((it) => {
      const p = (dir ? dir + '/' : '') + it.name;
      if (it.isDir) {
        rows.push(`<tr><td><button class="namebtn" onclick="loadFiles('${p}')">📁 ${it.name}</button></td><td></td>
          <td class="row-actions"><button class="btn danger" onclick="deleteEntry('${p}')">elimina</button></td></tr>`);
      } else {
        rows.push(`<tr><td><button class="namebtn" onclick="openFile('${p}')">📄 ${it.name}</button></td><td>${fmtBytes(it.size)}</td>
          <td class="row-actions"><button class="btn danger" onclick="deleteEntry('${p}')">elimina</button></td></tr>`);
      }
    });
  tbody.innerHTML = rows.join('');
}

let currentFile = null;
async function openFile(p) {
  const res = await fetch('/api/files/read?path=' + encodeURIComponent(p), { headers: authHeaders() });
  const d = await res.json();
  if (!res.ok) return alert(d.error);
  currentFile = p;
  document.getElementById('editor-path').textContent = p;
  document.getElementById('file-editor').value = d.content;
}

async function saveFile() {
  if (!currentFile) return alert('Nessun file aperto');
  const content = document.getElementById('file-editor').value;
  const res = await fetch('/api/files/write', {
    method: 'PUT',
    headers: { ...authHeaders(), 'Content-Type': 'application/json' },
    body: JSON.stringify({ path: currentFile, content }),
  });
  const d = await res.json();
  if (!res.ok) alert(d.error); else alert('Salvato');
}

async function deleteEntry(p) {
  if (!confirm('Eliminare ' + p + '?')) return;
  const res = await fetch('/api/files/delete?path=' + encodeURIComponent(p), { method: 'DELETE', headers: authHeaders() });
  const d = await res.json();
  if (!res.ok) alert(d.error);
  loadFiles(currentDir);
}

async function runExec() {
  const command = document.getElementById('exec-cmd').value;
  const out = document.getElementById('exec-out');
  out.textContent = 'Esecuzione...';
  const res = await fetch('/api/exec', {
    method: 'POST',
    headers: { ...authHeaders(), 'Content-Type': 'application/json' },
    body: JSON.stringify({ command }),
  });
  const d = await res.json();
  out.textContent = (d.stdout || '') + (d.stderr ? '\n[stderr]\n' + d.stderr : '') + (d.error ? 'Errore: ' + d.error : '');
}

if (TOKEN) {
  fetch('/api/login?token=' + encodeURIComponent(TOKEN)).then((r) => r.json()).then((d) => {
    if (d.ok) {
      document.getElementById('login').style.display = 'none';
      document.getElementById('app').style.display = 'flex';
      initApp();
    }
  });
}
</script>
</body>
</html>
